
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countries and Cities</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-4">

        <header class="mb-4">
            <h1>Countries and Cities</h1>
            <p class="text-muted">Explore and manage countries and their cities.</p>
        </header>

        <!-- Search -->
        <section class="mb-4">
            <div class="input-group">
                <input type="text" id="country-search" class="form-control" placeholder="Search for a country...">
                <button id="search-country" class="btn btn-primary">Search</button>
                <button id="get-countries" class="btn btn-secondary">All Countries</button>
            </div>
        </section>

        <!-- Main Content -->
        <main class="row g-4">

            <!-- Country Information -->
            <section class="col-md-5">
                <div class="card">
                    <div class="card-body">
                        <h2 class="card-title h4">Country Information</h2>

                        <div id="country-details">
                            <h3 class="h5"></h3>

                            <p><strong>ID:</strong> 1</p>
                            <p><strong>Capital:</strong> </p>
                            <p><strong>Population:</strong> </p>
                            <p><strong>Languages:</strong> </p>
                            <p><strong>Fun Fact:</strong> </p>

                            <button class="btn btn-primary btn-sm">GET</button>
                            <button class="btn btn-warning btn-sm">PATCH</button>
                            <button class="btn btn-danger btn-sm">DELETE</button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Cities -->
            <section class="col-md-7">
                <div class="card">
                    <div class="card-body">
                        <h2 class="card-title h4">Cities</h2>
                        <p class="text-muted">Cities belonging to the selected country.</p>

                        <div id="city-list">

                            <div class="card mb-3">
                                <div class="card-body">
                                    <h3 class="h5"> </h3>
                                    <p><strong>ID:</strong>  </p>
                                    <p><strong>Population:</strong>  </p>

                                    <button class="btn btn-primary btn-sm">GET</button>
                                    <button class="btn btn-warning btn-sm">PATCH</button>
                                    <button class="btn btn-danger btn-sm">DELETE</button>
                                </div>
                            </div>

                            <div class="card mb-3">
                                <div class="card-body">
                                    <h3 class="h5"></h3>
                                    <p><strong>ID:</strong>   </p>
                                    <p><strong>Population:</strong>  </p>

                                    <button class="btn btn-primary btn-sm">GET</button>
                                    <button class="btn btn-warning btn-sm">PATCH</button>
                                    <button class="btn btn-danger btn-sm">DELETE</button>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </section>

        </main>

        <!-- Create Form -->
        <section class="card mt-4">
            <div class="card-body">
                <h2 class="h4">Add a Country or City</h2>

                <form id="create-form">

                    <div class="mb-3">
                        <label for="record-type" class="form-label">Record Type</label>
                        <select id="record-type" class="form-select">
                            <option value="country">Country</option>
                            <option value="city">City</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" id="name" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="capital" class="form-label">Capital</label>
                        <input type="text" id="capital" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label for="population" class="form-label">Population</label>
                        <input type="number" id="population" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label for="languages" class="form-label">Languages</label>
                        <input type="text" id="languages" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label for="fun-fact" class="form-label">Fun Fact</label>
                        <textarea id="fun-fact" class="form-control"></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="country-id" class="form-label">Parent Country ID (City only)</label>
                        <input type="number" id="country-id" class="form-control">
                    </div>

                    <button type="submit" class="btn btn-success">POST - Create</button>

                </form>
            </div>
        </section>

    </div>

</body>
</html>
